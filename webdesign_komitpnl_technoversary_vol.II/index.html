<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="BakauKita mengajak warga Lhokseumawe dan pesisir Aceh menanam serta merawat hutan mangrove sebagai pelindung pantai." />
    <meta name="theme-color" content="#FFFFFF" />
    <title>BakauKita – Pulihkan Mangrove Pesisir Aceh</title>
    <!-- Kartu pratinjau saat tautan dibagikan (WhatsApp, Instagram, X, dll). Gambar harus URL absolut. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:site_name" content="BakauKita" />
    <meta property="og:title" content="BakauKita – Pulihkan Mangrove Pesisir Aceh" />
    <meta property="og:description" content="Kenali, tanam, dan rawat hutan mangrove pesisir Lhokseumawe dan Aceh. Coba simulasi pasang surut, kuis, dan baca artikel bersumber." />
    <meta property="og:url" content="https://amirullah310.github.io/BakauKita-komitpnl/" />
    <meta property="og:image" content="https://amirullah310.github.io/BakauKita-komitpnl/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo BakauKita di atas ilustrasi laguna bakau saat matahari terbit" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      Layar pemuat: ditulis langsung di HTML (bukan di React) supaya muncul seketika,
      sebelum JavaScript dan CSS utama selesai diunduh. Dihapus oleh src/main.jsx.
      Animasi: logo "tumbuh" dari akar ke daun (warna terisi dari bawah ke atas).
    -->
    <style>
      #pemuat {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #ffffff;
        transition: opacity 450ms ease, visibility 0s linear 450ms;
      }
      #pemuat.selesai { opacity: 0; visibility: hidden; }
      #pemuat.selesai .pemuat-logo { transform: scale(1.08); }
      .pemuat-logo { position: relative; width: 132px; height: 132px; transition: transform 450ms ease; }
      .pemuat-logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
      .pemuat-bayang { opacity: 0.14; filter: grayscale(1); }
      .pemuat-warna { animation: pemuat-tumbuh 1s cubic-bezier(.45,.05,.35,1) infinite; }
      .pemuat-nama {
        margin: 0; font: 700 1.25rem/1 "Plus Jakarta Sans Variable", system-ui, sans-serif; letter-spacing: -0.02em; color: #0E1A0B;
      }
      .pemuat-garis { position: relative; width: 120px; height: 4px; overflow: hidden; border-radius: 999px; background: #DDEBCD; }
      .pemuat-garis::after {
        content: ""; position: absolute; inset: 0; width: 40%; border-radius: inherit;
        background: linear-gradient(90deg, #5BA524, #7DBE1E);
        animation: pemuat-jalan 1.1s ease-in-out infinite;
      }
      .pemuat-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      @keyframes pemuat-tumbuh {
        0% { clip-path: inset(100% 0 0 0); }
        65%, 100% { clip-path: inset(0 0 0 0); }
      }
      @keyframes pemuat-jalan {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .pemuat-warna, .pemuat-garis::after { animation: none; }
        .pemuat-garis::after { width: 100%; }
        #pemuat, .pemuat-logo { transition-duration: 1ms; }
      }
    </style>
    <noscript><style>#pemuat { display: none; }</style></noscript>
  </head>
  <body>
    <div id="pemuat" role="status" aria-live="polite">
      <div class="pemuat-logo" aria-hidden="true">
        <img class="pemuat-bayang" src="/logo.webp" alt="" width="132" height="132" />
        <img class="pemuat-warna" src="/logo.webp" alt="" width="132" height="132" />
      </div>
      <p class="pemuat-nama" aria-hidden="true">BakauKita</p>
      <div class="pemuat-garis" aria-hidden="true"></div>
      <span class="pemuat-sr">Memuat halaman BakauKita…</span>
    </div>
    <script>
      // Pemuat hanya tampil di kunjungan pertama dalam satu sesi; setelah itu langsung ke konten.
      try {
        if (sessionStorage.getItem("bakaukita-dikunjungi")) document.getElementById("pemuat").remove();
        else sessionStorage.setItem("bakaukita-dikunjungi", "1");
      } catch (e) { /* penyimpanan diblokir: tetap tampilkan pemuat seperti biasa */ }
      // Pengaman: jika skrip utama gagal dimuat, jangan biarkan pemuat menutupi halaman selamanya.
      setTimeout(function () { var p = document.getElementById("pemuat"); if (p) p.remove(); }, 10000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
